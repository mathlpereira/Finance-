name: Atualizar dados do mercado

on:
  schedule:
    - cron: "*/30 12-23 * * 1-5"
    - cron: "0 15 * * 0,6"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: atualizar-dados
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar bibliotecas
        run: pip install --quiet yfinance requests
      - name: Buscar os dados
        run: python scripts/atualizar.py
      - name: Salvar no repositório
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/mercado.json
          git diff --cached --quiet && exit 0
          git commit -m "Atualização automática dos dados"
          for i in 1 2 3; do
            git pull --rebase origin main && git push && exit 0
            sleep 10
          done
          exit 1
